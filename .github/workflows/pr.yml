name: PR

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.14.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 ./...

  # Decides whether this run pushes anything to ttl.sh. Runs right before the
  # builds so the answer is as fresh as it can be; a hang that starts later is
  # bounded by each push step's own timeout instead.
  registry-probe:
    name: Probe ttl.sh
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.probe.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: hack

      - name: Probe upload initiation
        id: probe
        run: hack/probe-ttlsh.sh

  build-and-push:
    name: Build (${{ matrix.arch }})
    needs: [lint, test, registry-probe]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built whether or not ttl.sh takes uploads, so the Containerfile is
      # checked either way. The push steps rebuild from this cache, so their
      # time is the push alone.
      - name: Build
        timeout-minutes: 30
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,scope=build-${{ matrix.arch }},mode=max
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
            REVISION=${{ github.sha }}

      # ttl.sh is an anonymous registry with no SLA. It can accept the start of
      # an upload and then hang, or drop blob writes mid-push. The preview image
      # is a convenience rather than a check, so both attempts are best-effort:
      # a publish that fails twice leaves the job green with a warning.
      - name: Push to ttl.sh by digest
        id: push
        if: needs.registry-probe.outputs.publish == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ttl.sh/mcp-lostfilm,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
            REVISION=${{ github.sha }}

      - name: Push to ttl.sh by digest (retry)
        id: push-retry
        if: needs.registry-probe.outputs.publish == 'true' && steps.push.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ttl.sh/mcp-lostfilm,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
            REVISION=${{ github.sha }}

      - name: Export digest
        id: digest
        if: steps.push.outcome == 'success' || steps.push-retry.outcome == 'success'
        run: |
          mkdir -p /tmp/digests
          if [[ "${{ steps.push.outcome }}" == "success" ]]; then
            digest="${{ steps.push.outputs.digest }}"
          else
            digest="${{ steps.push-retry.outputs.digest }}"
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.digest.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Report unpublished image
        if: needs.registry-probe.outputs.publish == 'true' && steps.digest.outcome != 'success'
        run: echo "::warning::ttl.sh did not take the ${{ matrix.arch }} image after two attempts; it was built but not published"

  merge-manifests:
    name: Merge Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    outputs:
      published: ${{ steps.manifest.outcome == 'success' }}
    steps:
      # A leg whose push failed uploads no digest, so the set can be partial or
      # empty. A multi-arch tag missing a platform would hand that platform the
      # wrong image, so the manifest is assembled only from a complete set.
      - name: Download digests
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Collect digests
        id: collect
        run: |
          expected=2
          found="$(find /tmp/digests -type f 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "${found}" -eq "${expected}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "ttl.sh took ${found} of ${expected} platform images, so no multi-arch manifest was pushed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Docker Buildx
        if: steps.collect.outputs.ready == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # imagetools create writes to ttl.sh too, so it is as best-effort as the
      # pushes that fed it.
      - name: Create manifest list and push
        id: manifest
        if: steps.collect.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          IMAGE_NAME="ttl.sh/mcp-lostfilm"
          TAG="pr-${PR_NUMBER}-1d"

          images=()
          for digest_file in *; do
            [[ -f "$digest_file" ]] || continue
            images+=("${IMAGE_NAME}@sha256:${digest_file}")
          done

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${TAG}" \
            "${images[@]}"

      - name: Inspect image
        if: steps.manifest.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          docker buildx imagetools inspect "ttl.sh/mcp-lostfilm:pr-${PR_NUMBER}-1d"

      - name: Generate build summary
        if: steps.manifest.outcome == 'success'
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          IMAGE_TAG="ttl.sh/mcp-lostfilm:pr-${PR_NUMBER}-1d"

          {
            echo "## Multi-arch Container Image"
            echo ""
            echo "### Image Tag"
            echo "- \`${IMAGE_TAG}\`"
            echo ""
            echo "### Platforms"
            echo "- linux/amd64"
            echo "- linux/arm64"
            echo ""
            echo "### Pull Command"
            echo '```bash'
            echo "docker pull ${IMAGE_TAG}"
            echo '```'
            echo ""
            echo "> **Note:** Image expires in 24 hours (ttl.sh)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report unpublished manifest
        if: steps.collect.outputs.ready == 'true' && steps.manifest.outcome != 'success'
        run: echo "::warning::ttl.sh did not take the multi-arch manifest; the image was built but not published"

  # Steps are gated rather than the job, so the check always reports under its
  # own name: a required check that is skipped at job level can block a merge.
  notify:
    name: Notify PR
    runs-on: ubuntu-latest
    needs: merge-manifests
    timeout-minutes: 5
    steps:
      - name: Check if first build
        id: first_build
        if: needs.merge-manifests.outputs.published == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const hasLabel = labels.data.some(label => label.name === 'Container Available');
            return hasLabel ? 'false' : 'true';

      - name: Add label
        if: steps.first_build.outputs.result == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['Container Available']
            })

      - name: Comment on PR
        if: steps.first_build.outputs.result == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const imageTag = `ttl.sh/mcp-lostfilm:pr-${prNumber}-1d`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Container image available\n\n**Multi-arch image (amd64 + arm64):**\n\`\`\`bash\ndocker pull ${imageTag}\n\`\`\`\n\n> **Note:** Image is rebuilt on every push and expires after 24 hours (hosted on ttl.sh).`
            })
